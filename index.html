<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Yatırım Yeri</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#07111f;
    color:white;
    min-height:100vh;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   18+
========================= */

#ageScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
    radial-gradient(circle at top,#1b426d,#07111f 70%);
}

.ageBox{
    width:100%;
    max-width:430px;
    padding:30px 24px;
    text-align:center;
    background:#101c2d;
    border:1px solid #294563;
    border-radius:24px;
    box-shadow:0 20px 70px #0009;
}

.ageIcon{
    font-size:65px;
    margin-bottom:15px;
}

.ageBox h1{
    margin-bottom:14px;
}

.ageBox p{
    color:#aebdd0;
    line-height:1.6;
    margin-bottom:18px;
}

.warning{
    padding:14px;
    margin-bottom:20px;
    border-radius:12px;
    background:#302216;
    border:1px solid #70491d;
    color:#ffd18b;
    font-size:13px;
}

.ageButtons{
    display:flex;
    gap:10px;
}

.ageButtons button{
    flex:1;
    padding:14px;
    border:0;
    border-radius:11px;
    font-weight:bold;
}

.accept{
    background:#20c978;
    color:white;
}

.reject{
    background:#263548;
    color:#b9c4d0;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#07111fee;
    backdrop-filter:blur(15px);
    border-bottom:1px solid #1b3046;
    padding:16px;
}

.top{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logoIcon{
    width:43px;
    height:43px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#20d782,#168cff);
    font-size:23px;
}

.logo h1{
    font-size:20px;
}

.logo span{
    color:#7589a0;
    font-size:11px;
}

.cash{
    text-align:right;
}

.cash small{
    color:#71869e;
    display:block;
    font-size:11px;
}

.cash strong{
    color:#45e69a;
}

/* =========================
   MAIN
========================= */

.container{
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.card{
    background:#101c2d;
    border:1px solid #1c344c;
    border-radius:18px;
    padding:17px;
}

.card small{
    color:#8092a8;
}

.card h2{
    margin-top:8px;
    font-size:21px;
}

.green{
    color:#35dd91!important;
}

.red{
    color:#ff5d70!important;
}

/* =========================
   MARKET
========================= */

.sectionTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:25px 0 12px;
}

.sectionTitle h2{
    font-size:19px;
}

.sectionTitle span{
    color:#71869e;
    font-size:12px;
}

.market{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.asset{
    background:#101c2d;
    border:1px solid #1c344c;
    border-radius:18px;
    padding:15px;
    transition:.2s;
}

.asset:active{
    transform:scale(.98);
}

.assetName{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
}

.coin{
    width:43px;
    height:43px;
    border-radius:50%;
    background:#263c55;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}

.assetName strong{
    display:block;
}

.assetName small{
    color:#71869e;
}

.price{
    font-size:20px;
    font-weight:bold;
    margin-top:17px;
}

.change{
    margin-top:5px;
    font-size:13px;
}

.assetButtons{
    display:flex;
    gap:7px;
    margin-top:14px;
}

.assetButtons button{
    flex:1;
    border:0;
    border-radius:10px;
    padding:10px;
    font-weight:bold;
}

.buy{
    background:#19c778;
    color:#fff;
}

.sell{
    background:#e94d64;
    color:#fff;
}

.detailHint{
    color:#66809b;
    font-size:10px;
    margin-top:10px;
}

/* =========================
   NEWS
========================= */

.news{
    background:#101c2d;
    border:1px solid #1c344c;
    border-radius:18px;
    padding:16px;
}

.newsItem{
    display:flex;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid #1c3044;
}

.newsItem:last-child{
    border-bottom:0;
}

.newsIcon{
    font-size:24px;
}

.newsText strong{
    display:block;
    margin-bottom:4px;
}

.newsText small{
    color:#8092a8;
}

/* =========================
   EXPERT
========================= */

.expert{
    background:linear-gradient(135deg,#172e4b,#101c2d);
    border:1px solid #28547c;
    border-radius:18px;
    padding:18px;
}

.expert p{
    color:#9eafc1;
    line-height:1.5;
    margin:8px 0 15px;
}

.expert button{
    width:100%;
    border:0;
    border-radius:11px;
    padding:13px;
    background:#168cff;
    color:white;
    font-weight:bold;
}

/* =========================
   PORTFOLYO
========================= */

.portfolioItem{
    background:#101c2d;
    border:1px solid #1c344c;
    border-radius:15px;
    padding:15px;
    margin-bottom:10px;
}

.portfolioTop{
    display:flex;
    justify-content:space-between;
}

.portfolioBottom{
    display:flex;
    justify-content:space-between;
    color:#8092a8;
    margin-top:8px;
    font-size:12px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:500;
    background:#000c;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modalBox{
    width:100%;
    max-width:510px;
    max-height:94vh;
    overflow:auto;
    background:#101c2d;
    border:1px solid #29435d;
    border-radius:22px;
    padding:20px;
}

.close{
    border:0;
    width:35px;
    height:35px;
    border-radius:50%;
    background:#263548;
    color:white;
    font-size:20px;
}

/* =========================
   DETAY
========================= */

.detailHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.detailPrice{
    margin-top:18px;
}

.detailPrice strong{
    font-size:29px;
}

.detailChange{
    margin-top:5px;
}

.chartBox{
    margin-top:18px;
    background:#07111f;
    border:1px solid #1d354c;
    border-radius:15px;
    padding:10px;
}

canvas{
    width:100%;
    height:230px;
    display:block;
}

.timeButtons{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.timeButtons button{
    flex:1;
    border:1px solid #2b4762;
    background:#17283b;
    color:#9eafc1;
    padding:8px 3px;
    border-radius:8px;
    font-size:11px;
}

.timeButtons button.active{
    background:#168cff;
    color:white;
    border-color:#168cff;
}

.detailActions{
    display:flex;
    gap:9px;
    margin-top:15px;
}

.detailActions button{
    flex:1;
    border:0;
    border-radius:11px;
    padding:13px;
    font-weight:bold;
}

.expertDetail{
    margin-top:10px;
    width:100%;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#263548;
    color:white;
}

/* =========================
   UZMAN SONUÇ
========================= */

.expertDecision{
    text-align:center;
    font-size:29px;
    font-weight:bold;
    margin:15px 0;
}

.analysisBox{
    background:#07111f;
    border:1px solid #1d354c;
    border-radius:13px;
    padding:15px;
    line-height:1.8;
}

.forecastBox{
    margin-top:12px;
    background:#17283b;
    border-radius:13px;
    padding:15px;
    line-height:1.6;
}

.indicatorGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:12px;
}

.indicator{
    background:#17283b;
    border-radius:10px;
    padding:10px;
    text-align:center;
}

.indicator small{
    display:block;
    color:#7e94aa;
    font-size:10px;
}

.indicator strong{
    display:block;
    margin-top:5px;
    font-size:13px;
}

/* =========================
   TRADE
========================= */

.modalBox input{
    width:100%;
    padding:13px;
    margin:12px 0;
    border-radius:10px;
    border:1px solid #34506c;
    background:#07111f;
    color:white;
    outline:none;
}

.modalButtons{
    display:flex;
    gap:9px;
}

.modalButtons button{
    flex:1;
    border:0;
    padding:13px;
    border-radius:10px;
    font-weight:bold;
}

.cancel{
    background:#263548;
    color:white;
}

/* =========================
   RESULT
========================= */

#resultScreen{
    position:fixed;
    inset:0;
    z-index:900;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#07111f;
    text-align:center;
    padding:20px;
}

.resultBox{
    max-width:430px;
}

.resultEmoji{
    font-size:75px;
}

.resultBox h1{
    font-size:36px;
    margin:15px 0;
}

.resultBox p{
    color:#9eafc1;
    line-height:1.6;
}

.restart{
    margin-top:22px;
    padding:14px 30px;
    border:0;
    border-radius:11px;
    background:#168cff;
    color:white;
    font-weight:bold;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;
    left:50%;
    bottom:20px;
    z-index:2000;
    max-width:90%;
    transform:translate(-50%,100px);
    background:#17283b;
    border:1px solid #34506c;
    padding:13px 18px;
    border-radius:12px;
    text-align:center;
    transition:.3s;
}

#toast.show{
    transform:translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){
    .market{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .market{
        grid-template-columns:1fr;
    }

    .dashboard{
        grid-template-columns:1fr 1fr;
    }
