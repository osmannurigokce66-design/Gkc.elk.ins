<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gökçe Elektrik & İnşaat | Ankara Elektrik ve Tadilat</title>

<meta name="description" content="Gökçe Elektrik & İnşaat - Ankara genelinde elektrik, avize montajı, tadilat, tamirat, boya ve montaj hizmetleri.">
<meta name="theme-color" content="#111827">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fa;
    color:#172033;
    line-height:1.6;
}

/* =========================
   HEADER
========================= */

header{
    min-height:680px;
    background:
        linear-gradient(135deg,rgba(8,15,30,.96),rgba(17,35,60,.88)),
        url("https://images.unsplash.com/photo-1621905252507-b35492cc74b4?auto=format&fit=crop&w=1800&q=85");
    background-size:cover;
    background-position:center;
    color:white;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
}

.header-content{
    max-width:900px;
}

.logo-icon{
    width:82px;
    height:82px;
    margin:auto;
    margin-bottom:22px;
    border-radius:22px;
    background:#f4b400;
    color:#111827;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    font-weight:900;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

header h1{
    font-size:clamp(2.3rem,7vw,5rem);
    line-height:1.05;
    margin-bottom:20px;
    letter-spacing:-2px;
}

header h1 span{
    color:#f4b400;
}

header p{
    max-width:700px;
    margin:auto;
    color:#e5e7eb;
    font-size:clamp(1rem,2vw,1.25rem);
}

.location{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:25px;
    padding:10px 18px;
    border-radius:50px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.2);
    backdrop-filter:blur(8px);
}

.hero-buttons{
    margin-top:35px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:13px;
}

.hero-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:15px 25px;
    border-radius:12px;
    text-decoration:none;
    font-weight:800;
    transition:.25s;
}

.hero-btn:hover{
    transform:translateY(-3px);
}

.hero-phone{
    background:#f4b400;
    color:#111827;
}

.hero-whatsapp{
    background:#16a34a;
    color:white;
}

/* =========================
   NAVBAR
========================= */

nav{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(17,24,39,.96);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav-inner{
    max-width:1150px;
    margin:auto;
    min-height:65px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.nav-logo{
    color:white;
    font-weight:900;
    font-size:1.1rem;
}

.nav-logo span{
    color:#f4b400;
}

nav ul{
    list-style:none;
    display:flex;
    gap:25px;
}

nav a{
    color:#e5e7eb;
    text-decoration:none;
    font-weight:600;
    font-size:.95rem;
}

nav a:hover{
    color:#f4b400;
}

/* =========================
   GENERAL
========================= */

.container{
    max-width:1150px;
    margin:auto;
    padding:70px 20px;
}

.section-head{
    text-align:center;
    max-width:700px;
    margin:0 auto 45px;
}

.section-head h2{
    font-size:clamp(1.8rem,4vw,2.7rem);
    margin-bottom:10px;
}

.section-head p{
    color:#6b7280;
}

/* =========================
   STATS
========================= */

.stats{
    background:white;
    box-shadow:0 10px 40px rgba(0,0,0,.07);
    margin:-50px auto 0;
    position:relative;
    z-index:5;
    max-width:1000px;
    border-radius:18px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    overflow:hidden;
}

.stat{
    text-align:center;
    padding:25px 15px;
    border-right:1px solid #e5e7eb;
}

.stat:last-child{
    border-right:0;
}

.stat strong{
    display:block;
    font-size:1.8rem;
    color:#111827;
}

.stat span{
    color:#6b7280;
    font-size:.9rem;
}

/* =========================
   ABOUT
========================= */

.about{
    background:#111827;
    color:white;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:50px;
    align-items:center;
}

.about h2{
    font-size:2.5rem;
    margin-bottom:18px;
}

.about h2 span{
    color:#f4b400;
}

.about p{
    color:#d1d5db;
    margin-bottom:15px;
}

.about-list{
    list-style:none;
    margin-top:25px;
}

.about-list li{
    margin:12px 0;
    color:#f3f4f6;
}

.about-list span{
    color:#f4b400;
    margin-right:8px;
}

.about-card{
    border-radius:20px;
    overflow:hidden;
    min-height:350px;
    background:
        linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.25)),
        url("https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=1000&q=85");
    background-size:cover;
    background-position:center;
}

/* =========================
   SERVICES
========================= */

.services{
    background:#f5f7fa;
}

.services-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.service{
    background:white;
    padding:28px;
    border-radius:18px;
    border:1px solid #e5e7eb;
    transition:.25s;
    position:relative;
    overflow:hidden;
}

.service:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 35px rgba(0,0,0,.08);
}

.service-icon{
    width:55px;
    height:55px;
    border-radius:15px;
    background:#fff5cc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    margin-bottom:18px;
}

.service h3{
    margin-bottom:8px;
    font-size:1.15rem;
}

.service p{
    color:#6b7280;
    font-size:.94rem;
}

/* =========================
   WHY US
========================= */

.why{
    background:white;
}

.why-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.why-card{
    text-align:center;
    padding:25px 15px;
}

.why-card .big-icon{
    font-size:35px;
    margin-bottom:12px;
}

.why-card h3{
    margin-bottom:7px;
}

.why-card p{
    color:#6b7280;
    font-size:.9rem;
}

/* =========================
   PORTFOLIO
========================= */

.portfolio{
    background:#f5f7fa;
}

.portfolio-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
}

.portfolio-item{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.portfolio-item img{
    width:100%;
    height:260px;
    object-fit:cover;
    display:block;
}

.portfolio-content{
    padding:20px;
}

.portfolio-content h3{
    margin-bottom:6px;
}

.portfolio-content p{
    color:#6b7280;
}

/* =========================
   CTA
========================= */

.cta{
    background:
        linear-gradient(135deg,#111827,#243b5a);
    color:white;
    text-align:center;
}

.cta-inner{
    max-width:800px;
    margin:auto;
}

.cta h2{
    font-size:clamp(2rem,5vw,3rem);
    margin-bottom:12px;
}

.cta h2 span{
    color:#f4b400;
}

.cta p{
    color:#d1d5db;
    margin-bottom:28px;
}

.cta-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
}

.cta-btn{
    padding:14px 25px;
    border-radius:12px;
    text-decoration:none;
    font-weight:800;
}

.cta-phone{
    background:#f4b400;
    color:#111827;
}

.cta-wa{
    background:#16a34a;
    color:white;
}

/* =========================
   CONTACT
========================= */

.contact{
    background:white;
}

.contact-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.contact-card{
    background:#f8fafc;
    padding:30px;
    border-radius:18px;
    border:1px solid #e5e7eb;
}

.contact-card h3{
    margin-bottom:15px;
}

.contact-line{
    display:flex;
    gap:13px;
    align-items:center;
    margin:15px 0;
}

.contact-line .icon{
    width:45px;
    height:45px;
    border-radius:12px;
    background:#fff5cc;
    display:flex;
    align-items:center;
    justify-content:center;
}

.contact-line a{
    color:#172033;
    text-decoration:none;
    font-weight:700;
}

.map-box{
    min-height:300px;
    border-radius:18px;
    background:
        linear-gradient(rgba(17,24,39,.78),rgba(17,24,39,.78)),
        url("https://images.unsplash.com/photo-1523731407965-2430cd12f5e4?auto=format&fit=crop&w=1000&q=80");
    background-size:cover;
    background-position:center;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
}

.map-box strong{
    display:block;
    font-size:2rem;
    margin-bottom:10px;
    color:#f4b400;
}

/* =========================
   FOOTER
========================= */

footer{
    background:#0b1120;
    color:#9ca3af;
    text-align:center;
    padding:30px 20px;
}

footer strong{
    color:white;
}

.footer-small{
    margin-top:8px;
    font-size:.8rem;
}

/* =========================
   FLOATING BUTTONS
========================= */

.floating-buttons{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:500;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.float{
    width:55px;
    height:55px;
    border-radius:50%;
    display:flex;
    align-items:center;
