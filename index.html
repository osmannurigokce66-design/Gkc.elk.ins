<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gökçe Elektrik & İnşaat | Ankara</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6f8;
    color:#172033;
    line-height:1.6;
}

a{
    text-decoration:none;
}

/* HERO */

.hero{
    min-height:650px;
    background:
        linear-gradient(rgba(10,18,32,.90),rgba(10,18,32,.90)),
        url("https://images.unsplash.com/photo-1621905252507-b35492cc74b4?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
}

.hero-content{
    max-width:850px;
}

.logo{
    width:80px;
    height:80px;
    border-radius:20px;
    background:#f4b400;
    color:#111827;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 25px;
    font-size:42px;
    font-weight:bold;
}

.hero h1{
    font-size:clamp(38px,7vw,72px);
    line-height:1.05;
    margin-bottom:20px;
}

.hero h1 span{
    color:#f4b400;
}

.hero p{
    font-size:20px;
    color:#e5e7eb;
    max-width:700px;
    margin:auto;
}

.location{
    display:inline-block;
    margin-top:25px;
    padding:9px 18px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:30px;
    background:rgba(255,255,255,.08);
}

.buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-top:32px;
}

.btn{
    display:inline-block;
    padding:15px 25px;
    border-radius:12px;
    font-weight:bold;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-3px);
}

.btn-yellow{
    background:#f4b400;
    color:#111827;
}

.btn-green{
    background:#16a34a;
    color:white;
}

/* NAV */

nav{
    position:sticky;
    top:0;
    z-index:100;
    background:#111827;
    color:white;
}

.nav-inner{
    max-width:1150px;
    margin:auto;
    min-height:65px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
}

.nav-logo{
    font-weight:bold;
}

.nav-logo span{
    color:#f4b400;
}

nav ul{
    display:flex;
    gap:25px;
    list-style:none;
}

nav a{
    color:white;
    font-size:14px;
}

nav a:hover{
    color:#f4b400;
}

/* GENERAL */

.container{
    max-width:1150px;
    margin:auto;
    padding:70px 20px;
}

.section-title{
    text-align:center;
    margin-bottom:45px;
}

.section-title h2{
    font-size:38px;
    margin-bottom:10px;
}

.section-title p{
    color:#6b7280;
}

/* STATS */

.stats{
    max-width:1000px;
    margin:-45px auto 0;
    position:relative;
    z-index:5;
    background:white;
    border-radius:18px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    box-shadow:0 10px 35px rgba(0,0,0,.1);
    overflow:hidden;
}

.stat{
    text-align:center;
    padding:25px 10px;
    border-right:1px solid #e5e7eb;
}

.stat:last-child{
    border:none;
}

.stat strong{
    display:block;
    font-size:28px;
    margin-bottom:5px;
}

.stat span{
    color:#6b7280;
}

/* ABOUT */

.about{
    background:#111827;
    color:white;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:50px;
    align-items:center;
}

.about h2{
    font-size:40px;
    margin-bottom:20px;
}

.about h2 span{
    color:#f4b400;
}

.about p{
    color:#d1d5db;
    margin-bottom:15px;
}

.about-list{
    list-style:none;
    margin-top:25px;
}

.about-list li{
    margin:12px 0;
}

.about-list b{
    color:#f4b400;
    margin-right:8px;
}

.about-image{
    min-height:350px;
    border-radius:20px;
    background:
        linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.2)),
        url("https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=1000&q=80");
    background-size:cover;
    background-position:center;
}

/* SERVICES */

.services{
    background:#f5f6f8;
}

.services-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.service{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:28px;
    transition:.2s;
}

.service:hover{
    transform:translateY(-5px);
    box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.service-icon{
    width:55px;
    height:55px;
    border-radius:15px;
    background:#fff4c7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    margin-bottom:18px;
}

.service h3{
    margin-bottom:8px;
}

.service p{
    color:#6b7280;
}

/* WHY */

.why{
    background:white;
}

.why-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.why-card{
    text-align:center;
    padding:25px 15px;
}

.why-icon{
    font-size:38px;
    margin-bottom:12px;
}

.why-card p{
    color:#6b7280;
    font-size:14px;
}

/* PORTFOLIO */

.portfolio{
    background:#f5f6f8;
}

.portfolio-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
}

.portfolio-item{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 7px 25px rgba(0,0,0,.06
